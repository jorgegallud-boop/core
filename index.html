<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programa de core · L5-S1</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#1e2320; --ink-soft:#5c645e; --ink-mute:#8a9089;
    --line:#e1ddd2; --accent:#0f6e56; --accent-soft:#e1f5ee; --accent-ink:#085041;
    --warn:#854f0b; --warn-soft:#faeeda; --danger:#a32d2d; --danger-soft:#fcebeb;
    --rest:#185fa5; --rest-soft:#e6f1fb;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181a; --card:#1e2225; --ink:#eceae3; --ink-soft:#a9aca6; --ink-mute:#787d78;
      --line:#31352f; --accent:#5dcaa5; --accent-soft:#0f2a22; --accent-ink:#9fe1cb;
      --warn:#f0c479; --warn-soft:#332405; --danger:#f09595; --danger-soft:#3a1414;
      --rest:#85b7eb; --rest-soft:#0c2136;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:3rem;
  }
  .wrap{max-width:640px;margin:0 auto;padding:1.1rem 1rem 2rem;}
  .typebar{display:flex;gap:8px;margin-bottom:.6rem;}
  .typechip{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:12px 10px;text-align:center;cursor:pointer;color:var(--ink);}
  .typechip .tname{display:block;font-size:14px;font-weight:600;}
  .typechip .tsub{display:block;font-size:11.5px;color:var(--ink-mute);margin-top:2px;}
  .typechip.active{background:var(--accent);border-color:var(--accent);}
  .typechip.active .tname,.typechip.active .tsub{color:var(--accent-ink);}
  .musiccard{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;margin-bottom:.8rem;}
  .musicrow{display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;}
  .musiclabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px;}
  .musicrow input[type=text]{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;}
  .musicx{border:none;background:transparent;color:var(--ink-mute);font-size:19px;cursor:pointer;line-height:1;padding:0 2px;}
  .musicnote{font-size:11px;color:var(--ink-mute);margin-top:6px;line-height:1.4;}
  .musicnote code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:10.5px;word-break:break-all;}
  .spotifylink{color:var(--accent);}
  .spotifylist{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .spotifyitem{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--ink);}
  .spotifyitem:hover{background:var(--accent-soft);}
  .spotifyitem img{width:32px;height:32px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.1rem 1.2rem;}
  .card + .card{margin-top:.9rem;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;
    background:var(--accent-soft);color:var(--accent-ink);letter-spacing:.02em;}
  .badge.rest{background:var(--rest-soft);color:var(--rest);}
  .daytitle{font-size:18px;font-weight:600;margin:.55rem 0 .2rem;}
  .daydesc{font-size:13.5px;color:var(--ink-soft);margin:0 0 .8rem;line-height:1.45;}
  .exlist{list-style:none;margin:0;padding:0;}
  .exlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;}
  .exlist li:first-child{border-top:none;}
  .exlist .exname{color:var(--ink);}
  .exlist .exmeta{color:var(--ink-mute);font-size:12.5px;white-space:nowrap;}
  .sectionlabel{font-size:11px;font-weight:600;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin:.9rem 0 .2rem;}
  .esttime{font-size:12.5px;color:var(--ink-mute);margin-top:.7rem;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;
    font-size:15px;font-weight:600;padding:13px 18px;cursor:pointer;width:100%;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;}
  .btnrow{display:flex;gap:8px;margin-top:.9rem;}
  .btnrow .btn{width:auto;flex:1;}
  .light-note{font-size:12.5px;color:var(--ink-mute);margin-top:.6rem;line-height:1.5;}
  .libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:.6rem;}
  .libcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem;text-align:center;cursor:pointer;}
  .libcard svg{width:100%;height:56px;color:var(--ink-soft);}
  .libcard .lname{font-size:12px;margin-top:4px;color:var(--ink);line-height:1.3;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .overlay.show{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:1.1rem 1.2rem 1.5rem;
    max-height:82vh;overflow-y:auto;}
  .sheet .close{float:right;border:none;background:transparent;font-size:20px;color:var(--ink-mute);cursor:pointer;line-height:1;}
  .sheet h2{font-size:17px;font-weight:600;margin:.2rem 0 .6rem;}
  .sheet svg{width:100%;max-width:260px;height:150px;color:var(--accent);display:block;margin:0 auto .8rem;}
  .sheet ol{margin:0 0 .8rem;padding-left:1.15rem;font-size:14px;line-height:1.55;}
  .sheet .cue{font-size:13px;font-style:italic;color:var(--ink-soft);border-left:3px solid var(--accent);padding-left:.6rem;}
  .runner{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;}
  .runner.show{display:flex;}
  .runner-top{padding:.7rem 1rem 0;}
  .progressbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progressbar-fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}
  .runner-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem 1.4rem;}
  .runner-phase{font-size:12px;font-weight:600;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;}
  .runner-name{font-size:23px;font-weight:600;margin:.7rem 0 .1rem;line-height:1.25;}
  .runner-name.rest{color:var(--rest);}
  .runner-set{font-size:13.5px;color:var(--ink-soft);margin-bottom:1rem;}
  .runner-time{font-size:76px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;margin:.4rem 0;}
  .runner-side{font-size:14px;font-weight:600;color:var(--warn);min-height:20px;margin-bottom:.2rem;}
  .runner-next{font-size:13px;color:var(--ink-mute);margin-top:.8rem;}
  .runner-desc{font-size:13px;color:var(--ink-soft);max-width:320px;margin:.5rem auto 0;line-height:1.45;}
  .runner-info{margin-top:.7rem;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink-soft);
    font-size:13px;padding:6px 14px;cursor:pointer;}
  .runner-controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:1rem 1rem 1.6rem;}
  .ctrlbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ctrlbtn.big{width:66px;height:66px;background:var(--accent);color:#fff;border:none;font-size:23px;}
  .ctrlbtn.exit{color:var(--danger);}
  .donecard{text-align:center;padding:2.4rem 1.4rem;}
  .donecard .tick{font-size:52px;color:var(--accent);}
  .donecard h2{font-size:20px;margin:.6rem 0 .3rem;}
  .donecard p{font-size:13.5px;color:var(--ink-soft);margin:0 0 1.4rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="typebar" id="equipBar"></div>
  <div class="typebar" id="typeBar"></div>

  <div class="musiccard" id="musicCard"></div>

  <div id="sessionCard"></div>

  <div class="sectionlabel">Todos los ejercicios</div>
  <div class="libgrid" id="libGrid"></div>
</div>

<div class="overlay" id="infoOverlay">
  <div class="sheet">
    <button class="close" id="infoClose" aria-label="Cerrar">&times;</button>
    <h2 id="infoTitle"></h2>
    <div id="infoSvg"></div>
    <ol id="infoSteps"></ol>
    <div class="cue" id="infoCue"></div>
  </div>
</div>

<div class="runner" id="runner">
  <div class="runner-top">
    <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>
  </div>
  <div class="runner-body" id="runnerBody"></div>
  <div class="runner-controls" id="runnerControls"></div>
</div>

<script>
(function(){

var POSES = {

  band_walk: '<circle cx="80" cy="20" r="9"/><path d="M80,29 L80,55"/><path d="M80,44 L58,58"/><path d="M80,44 L102,58"/><path d="M80,55 L54,90"/><path d="M80,55 L109,90"/><line x1="54" y1="90" x2="109" y2="90" stroke="currentColor" stroke-width="2" opacity="0.4" stroke-dasharray="4 3"/><line class="floor" x1="10" y1="93" x2="150" y2="93"/>',

};

function svgFor(poseKey){
  var inner = POSES[poseKey] || POSES.supine_neutral;
  inner = inner.split('class="floor"').join('stroke="currentColor" stroke-width="2" opacity="0.25"');
  return '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}

var EXLIB = {
  catcamel:{name:'Cat-camel', pose:'quad_neutral', steps:[
    'Colócate a cuatro apoyos, manos bajo los hombros y rodillas bajo las caderas.',
    'Al inspirar, deja caer el ombligo y sube la mirada (posición vaca).',
    'Al espirar, redondea la espalda empujando el suelo con las manos y mete la barbilla (posición gato).',
    'Alterna ambas posiciones de forma lenta y controlada.'
  ], brief:'Alterna arquear y redondear la espalda, muy despacio.', cue:'Movimiento suave, sin forzar el rango.'},
  bridge_basic:{name:'Puente de glúteo básico', pose:'supine_bridge', steps:[
    'Túmbate boca arriba, rodillas dobladas y pies apoyados cerca de los glúteos.',
    'Activa el abdomen (bracing) antes de moverte.',
    'Sube las caderas apretando los glúteos, sin arquear la zona lumbar.',
    'Baja con control hasta casi tocar el suelo y repite.'
  ], brief:'Sube la cadera apretando el glúteo, sin arquear la lumbar.', cue:'Sube por los talones, aprieta el glúteo arriba.'},
  breathing_bracing:{name:'Respiración + bracing', pose:'supine_neutral', steps:[
    'Túmbate boca arriba con las rodillas dobladas.',

    'Mantén esa tensión al 30-40% unos segundos, respirando con normalidad.'
  ], brief:'Lleva el aire a las costillas y aprieta el abdomen al espirar.', cue:'Este patrón es la base de todos los ejercicios siguientes.'},
  deadbug:{name:'Dead bug', pose:'supine_deadbug', unilateral:true, steps:[
    'Túmbate boca arriba, brazos hacia el techo y caderas y rodillas a 90°.',
    'Activa el bracing.',
    'Baja lentamente el brazo derecho y la pierna izquierda hasta casi tocar el suelo, sin despegar la zona lumbar del suelo.',
    'Vuelve al centro con control y repite con el lado contrario.'
  ], brief:'Baja brazo y pierna contrarios sin despegar la lumbar del suelo.', cue:'La espalda baja no se separa del suelo en ningún momento.'},
  deadbug_crossed:{name:'Dead bug (brazos cruzados)', pose:'supine_deadbug', unilateral:true, steps:[
    'Túmbate boca arriba, brazos cruzados sobre el pecho, caderas y rodillas a 90°.',
    'Activa el bracing.',
    'Baja una pierna lentamente hasta casi tocar el suelo sin mover la zona lumbar.',
    'Vuelve al centro y repite con la otra pierna.'
  ], brief:'Baja una pierna despacio sin mover la zona lumbar.', cue:'Versión más simple para reforzar el patrón sin usar los brazos.'},
  birddog:{name:'Bird-dog', pose:'quad_birddog', unilateral:true, steps:[
    'A cuatro apoyos, manos bajo los hombros y rodillas bajo las caderas.',
    'Activa el bracing y mantén la espalda plana.',
    'Extiende el brazo derecho hacia delante y la pierna izquierda hacia atrás a la vez.',
    'Mantén unos segundos sin rotar cadera ni hombros, vuelve al centro y cambia de lado.'
  ], brief:'Extiende brazo y pierna contrarios sin rotar cadera ni hombros.', cue:'Cadera y hombros siempre nivelados, como si llevaras un vaso de agua en la espalda.'},
  plank_front:{name:'Plancha frontal', pose:'plank', steps:[
    'Apóyate en antebrazos y puntas de los pies, codos bajo los hombros.',
    'Activa el bracing y aprieta los glúteos.',
    'Forma una línea recta desde la cabeza hasta los talones.',
    'Mantén la posición sin dejar caer ni subir la cadera.'
  ], brief:'Mantén el cuerpo en línea recta, apoyado en antebrazos y pies.', cue:'Si la lumbar se hunde, sube la cadera un poco hasta alinear.'},
  glute_bridge_bipodal:{name:'Puente de glúteo (bipodal)', pose:'supine_bridge', steps:[
    'Túmbate boca arriba, rodillas dobladas y pies apoyados.',
    'Activa el bracing.',
    'Sube las caderas apretando los glúteos, sin arquear la zona lumbar.',
    'Baja con control y repite.'
  ], brief:'Sube la cadera apretando el glúteo, sin arquear la espalda.', cue:'Sube por los talones, aprieta el glúteo arriba, sin arquear en exceso.'},
  glute_bridge_unilateral:{name:'Puente de glúteo a una pierna', pose:'supine_bridge', unilateral:true, steps:[

    'Mantén la cadera elevada y nivelada, sin que el lado libre caiga.',

  side_plank_knee:{name:'Plancha lateral (apoyo rodilla)', pose:'side_plank', unilateral:true, steps:[
    'Túmbate de lado apoyado en el antebrazo, codo bajo el hombro.',

  ], brief:'De lado, apoyado en antebrazo y rodilla, eleva la cadera.', cue:'Cadera elevada y alineada durante todo el tiempo.'},
  side_plank_foot:{name:'Plancha lateral (apoyo pie)', pose:'side_plank', unilateral:true, steps:[
    'Túmbate de lado apoyado en el antebrazo, piernas estiradas y pies apilados.',

  ], brief:'De lado, con piernas estiradas, eleva la cadera en línea recta.', cue:'Sube a esta versión solo si mantienes la técnica en la de rodilla.'},
  plank_shoulder_tap:{name:'Plancha con toques de hombro', pose:'plank', unilateral:true, steps:[
    'Colócate en plancha alta, manos bajo los hombros.',
    'Activa el bracing y separa un poco los pies para más estabilidad.',
    'Lleva una mano al hombro contrario sin que la cadera se mueva ni rote.',

  ], brief:'En plancha, toca el hombro contrario sin mover la cadera.', cue:'La cadera se queda quieta; el movimiento es solo del brazo.'},
  bear_hold:{name:'Bear hold', pose:'quad_bear', steps:[

  bridge_march:{name:'Marcha de puente', pose:'supine_bridge', unilateral:true, steps:[

    'Baja el pie con control y repite con la otra pierna.',
    'Alterna manteniendo la cadera estable todo el tiempo.'
  ], brief:'Con la cadera elevada, sube una rodilla al pecho sin que la cadera caiga.', cue:'Si la cadera cae al levantar el pie, reduce el rango.'},
  side_plank_thread:{name:'Plancha lateral con giro', pose:'side_plank', unilateral:true, steps:[
    'En plancha lateral con apoyo en el antebrazo, brazo libre extendido hacia el techo.',

var soundOn = true;

var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){ var Ctx = window.AudioContext || window.webkitAudioContext; if(Ctx){ audioCtx = new Ctx(); } }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }catch(e){}
}
function beep(freq, dur, vol){
  if(!soundOn) return;
  try{
    ensureAudio();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.frequency.value = freq; o.type='sine';
    g.gain.value = vol || 0.16;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur/1000);
    o.stop(audioCtx.currentTime + dur/1000 + 0.03);
  }catch(e){}
}

var preferredVoice = null;
function pickVoice(){
  try{
    if(!window.speechSynthesis) return;
    var voices = window.speechSynthesis.getVoices() || [];
    var esVoices = voices.filter(function(v){ return /^es/i.test(v.lang); });
    var malePattern = /jorge|pablo|diego|carlos|miguel|enrique|male|hombre|var[oó]n/i;
    var qualityPattern = /neural|enhanced|natural|premium|online|wavenet/i;
    var best = null, bestScore = -1;
    esVoices.forEach(function(v){
      var score = 0;
      if(malePattern.test(v.name)) score += 2;
      if(qualityPattern.test(v.name)) score += 1;
      if(score > bestScore){ bestScore = score; best = v; }
    });
    preferredVoice = best || esVoices[0] || null;
  }catch(e){}
}
pickVoice();
try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}

function speak(text){
  if(!soundOn) return;
  try{
    if(!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = preferredVoice ? preferredVoice.lang : 'es-ES';
    if(preferredVoice) u.voice = preferredVoice;
    u.rate = 1.1;
    u.pitch = 0.92;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeech(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
}

function b64url(buffer){
  var bytes = new Uint8Array(buffer), str = '';
  for(var i=0;i<bytes.length;i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randomVerifier(){
  var arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return b64url(arr.buffer);
}
function sha256(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}

function spotifyConnect(){
  var clientId = getSpotifyClientId();
  if(!clientId) return;
  var verifier = randomVerifier();
  try{ sessionStorage.setItem('core_spotify_verifier', verifier); }catch(e){}
  sha256(verifier).then(function(hash){
    var challenge = b64url(hash);
    var params = new URLSearchParams({
      client_id: clientId,
      response_type: 'code',
      redirect_uri: getRedirectUri(),
      code_challenge_method: 'S256',
      code_challenge: challenge,
      scope: SPOTIFY_SCOPES,
      show_dialog: 'true'
    });
    window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  });
}

function handleSpotifyRedirect(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  if(!code) return;
  var verifier = null;
  try{ verifier = sessionStorage.getItem('core_spotify_verifier'); }catch(e){}
  var clientId = getSpotifyClientId();
  window.history.replaceState({}, document.title, getRedirectUri());
  if(!verifier || !clientId) return;
  var body = new URLSearchParams({
    client_id: clientId, grant_type:'authorization_code', code: code,
    redirect_uri: getRedirectUri(), code_verifier: verifier
  });
  fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString()
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.access_token){
      saveSpotifyTokens(data);
      activateFixedPlaylist();
    }
  }).catch(function(){});
}

function refreshSpotifyToken(){
  var t = getSpotifyTokenData();
  var clientId = getSpotifyClientId();
  if(!t.refresh || !clientId) return Promise.resolve('');
  var body = new URLSearchParams({ client_id: clientId, grant_type:'refresh_token', refresh_token: t.refresh });
  return fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString()
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.access_token){ saveSpotifyTokens(data); return data.access_token; }
    return '';
  }).catch(function(){ return ''; });
}

function getSpotifyAccessToken(){
  var t = getSpotifyTokenData();
  if(t.access && Date.now() < t.expiresAt - 5000) return Promise.resolve(t.access);
  return refreshSpotifyToken();
}

function spotifyApi(method, path, body){
  return getSpotifyAccessToken().then(function(token){
    if(!token) throw new Error('no_token');
    return fetch('https://api.spotify.com/v1'+path, {
      method: method,
      headers: { Authorization:'Bearer '+token, 'Content-Type':'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
  });
}

function fetchSpotifyPlaylistName(){
  var id = FIXED_SPOTIFY_PLAYLIST_URI.split(':').pop();
  return spotifyApi('GET','/playlists/'+id+'?fields=name').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){ return (data && data.name) || ''; }).catch(function(){ return ''; });
}

function activateFixedPlaylist(){
  musicMode = 'active';
  renderMusicCard();
  spotifyPlayContext(FIXED_SPOTIFY_PLAYLIST_URI).then(reportSpotifyPlaybackResult).catch(function(){});
  if(!spotifyActiveName){
    fetchSpotifyPlaylistName().then(function(name){
      if(!name) return;
      spotifyActiveName = name;
      try{ localStorage.setItem('core_spotify_active_name', name); }catch(e){}
      if(musicMode==='active') renderMusicCard();
    });
  }
}

var spotifyDeviceId = '';

function spotifyGetDevices(){
  return spotifyApi('GET','/me/player/devices').then(function(r){
    if(!r.ok){
      return r.json().catch(function(){ return {}; }).then(function(body){
        return { error: r.status, message: (body.error && body.error.message) || '', devices: [] };
      });
    }
    return r.json().then(function(data){ return { error:0, message:'', devices: (data && data.devices) || [] }; });
  }).catch(function(){ return { error:-1, message:'', devices: [] }; });
}
function pickSpotifyDeviceId(devices){
  if(!devices.length) return '';
  var active = devices.filter(function(d){ return d.is_active; })[0];
  if(active) return active.id;
  var phone = devices.filter(function(d){ return d.type==='Smartphone'; })[0];
  if(phone) return phone.id;
  return devices[0].id;
}

function spotifyPlayContext(uri){
  return spotifyGetDevices().then(function(result){
    if(result.error===401 || result.error===403){
      return { status: result.error, ok:false, _msg: result.message, _stage:'devices' };
    }
    var deviceId = pickSpotifyDeviceId(result.devices);
    spotifyDeviceId = deviceId;
    if(!deviceId) return { status:404, ok:false, _stage:'nodevice' };
    return spotifyApi('PUT','/me/player/play?device_id='+encodeURIComponent(deviceId), { context_uri: uri });
  });
}
function spotifyPause(){
  var path = '/me/player/pause' + (spotifyDeviceId ? ('?device_id='+encodeURIComponent(spotifyDeviceId)) : '');
  return spotifyApi('PUT', path).catch(function(){});
}
function spotifyResume(){
  var path = '/me/player/play' + (spotifyDeviceId ? ('?device_id='+encodeURIComponent(spotifyDeviceId)) : '');
  return spotifyApi('PUT', path).catch(function(){});
}
function spotifyNext(){
  var path = '/me/player/next' + (spotifyDeviceId ? ('?device_id='+encodeURIComponent(spotifyDeviceId)) : '');
  return spotifyApi('POST', path).then(reportSpotifyPlaybackResult)
    .catch(function(){ setSpotifyRunnerNote('🎵 No se pudo pasar de canción.'); });
}

function renderMusicCard(){
  var el = document.getElementById('musicCard');
  if(!el) return;
  var clientId = getSpotifyClientId();

  if(musicMode==='config'){
    el.innerHTML =
      '<div class="musicrow">'+
        '<input type="text" id="spotifyClientIdInput" placeholder="Client ID de Spotify" value="'+escapeAttr(clientId)+'">'+
        '<button class="btn btn-small btn-primary" id="spotifyClientIdSave" type="button">Guardar</button>'+
        '<button class="musicx" id="spotifyConfigCancel" type="button" aria-label="Cancelar">&times;</button>'+
      '</div>'+
      '<p class="musicnote">Créala gratis en <a class="spotifylink" href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>. '+
      'Como "Redirect URI" de la app pon exactamente: <code>'+escapeAttr(getRedirectUri())+'</code> '+
      '<button class="btn btn-small btn-secondary" id="spotifyCopyUri" type="button">Copiar</button></p>';
    document.getElementById('spotifyClientIdSave').addEventListener('click', function(){
      var val = document.getElementById('spotifyClientIdInput').value.trim();
      if(!val) return;
      setSpotifyClientId(val);
      musicMode = 'none';
      renderMusicCard();
    });
    document.getElementById('spotifyCopyUri').addEventListener('click', function(){
      var copyBtn = document.getElementById('spotifyCopyUri');
      var done = function(){ copyBtn.textContent = 'Copiado'; setTimeout(function(){ copyBtn.textContent = 'Copiar'; }, 1500); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(getRedirectUri()).then(done).catch(function(){});
      }
    });
    document.getElementById('spotifyConfigCancel').addEventListener('click', function(){ musicMode='none'; renderMusicCard(); });

  } else if(musicMode==='active'){
    el.innerHTML =
      '<div class="musicrow">'+
        '<span class="musiclabel">🎵 '+escapeAttr(spotifyActiveName || 'Playlist conectada')+'</span>'+
        '<button class="btn btn-small btn-secondary" id="spotifyNextBtn" type="button">⏭ Siguiente</button>'+
        '<button class="musicx" id="musicRemove" type="button" aria-label="Desconectar Spotify">&times;</button>'+
      '</div>'+
      '<p class="musicnote" id="spotifyDeviceNote"></p>';
    document.getElementById('spotifyNextBtn').addEventListener('click', spotifyNext);
    document.getElementById('musicRemove').addEventListener('click', spotifyDisconnect);

  } else {
    el.innerHTML =
      '<div class="musicrow">'+
        '<span class="musiclabel">🎵 Música de fondo (opcional)</span>'+
        '<button class="btn btn-small btn-secondary" id="spotifyMainBtn" type="button">Conectar Spotify</button>'+
      '</div>';
    document.getElementById('spotifyMainBtn').addEventListener('click', function(){
      if(clientId) spotifyConnect();
      else { musicMode='config'; renderMusicCard(); }
    });
  }
}

function initMusicMode(){
  if(!spotifyIsConnected()){ musicMode = 'none'; return; }
  musicMode = 'active';
  if(!spotifyActiveName){
    fetchSpotifyPlaylistName().then(function(name){
      if(!name) return;
      spotifyActiveName = name;
      try{ localStorage.setItem('core_spotify_active_name', name); }catch(e){}
      if(musicMode==='active') renderMusicCard();
    });
  }
}

function setSpotifyRunnerNote(msg){
  ['spotifyDeviceNote','spotifyRunnerNote'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = msg || '';
  });
}

function reportSpotifyPlaybackResult(r){
  if(!r){ setSpotifyRunnerNote(''); return; }
  if(r.status===404 && r._stage==='nodevice'){
    setSpotifyRunnerNote('🎵 No aparece tu móvil como dispositivo de Spotify. Abre la app, dale a reproducir algo un segundo (para que se active) y vuelve a pulsar "Empezar entrenamiento".');
  } else if(r.status===401 || r.status===403){
    var reason = r._stage==='devices'
      ? 'Falta el permiso para leer tus dispositivos: '
      : 'Sin permiso para controlar la reproducción (o falta Premium): ';
    setSpotifyRunnerNote('🎵 '+reason+'ve al bloque de música, pulsa "×" y vuelve a "Conectar Spotify" (fíjate en que te enseñe otra vez la pantalla de permisos de Spotify).'+(r._msg ? ' ['+r._msg+']' : ''));
  } else if(r.status===404){
    setSpotifyRunnerNote('🎵 Spotify no encontró la reproducción (404).');
  } else if(!r.ok){
    setSpotifyRunnerNote('🎵 Spotify no pudo iniciar la música (código '+r.status+').');
  } else {
    setSpotifyRunnerNote('');
  }
}

function startMusic(){
  if(musicMode!=='active' || !spotifyActiveUri) return;
  spotifyPlayContext(spotifyActiveUri).then(reportSpotifyPlaybackResult)
    .catch(function(){ setSpotifyRunnerNote('🎵 No se pudo conectar con Spotify.'); });
}
function resumeMusic(){
  if(musicMode!=='active') return;
  var path = '/me/player/play' + (spotifyDeviceId ? ('?device_id='+encodeURIComponent(spotifyDeviceId)) : '');
  spotifyApi('PUT', path).then(reportSpotifyPlaybackResult)
    .catch(function(){ setSpotifyRunnerNote('🎵 No se pudo conectar con Spotify.'); });
}
function pauseMusic(){
  if(musicMode==='active') spotifyPause();
}
function stopMusic(){
  if(musicMode==='active') spotifyPause();
}

var runnerState = null;

function buildQueue(session){
  var blocks = [
    {phase:'Calentamiento', list: WARM},
    {phase:'Principal', list: session},
    {phase:'Vuelta a la calma', list: COOLDOWN}
  ];
  var queue = [];
  blocks.forEach(function(block){
    block.list.forEach(function(ex){
      for(var s=1; s<=ex.sets; s++){
        queue.push({phase:block.phase, key:ex.key, setIndex:s, totalSets:ex.sets, kind:'work', duration:ex.work, unilateral:!!EXLIB[ex.key].unilateral});
        var isLastOfAll = (block===blocks[blocks.length-1]) && (ex===block.list[block.list.length-1]) && (s===ex.sets);
        if(ex.rest>0 && !isLastOfAll){
          queue.push({phase:block.phase, key:ex.key, setIndex:s, totalSets:ex.sets, kind:'rest', duration:ex.rest});
        }
      }
    });
  });
  return queue;
}

function nextWorkLabel(queue, fromIdx){
  for(var i=fromIdx+1;i<queue.length;i++){
    if(queue[i].kind==='work') return EXLIB[queue[i].key].name;
  }
  return null;
}

function startWorkout(session, title){
  var queue = buildQueue(session);
  launchRunner(queue, title);
}

function startLightSession(){
  var queue = [
    {phase:'Ligero', key:'breathing_bracing', setIndex:1, totalSets:2, kind:'work', duration:30, unilateral:false},
    {phase:'Ligero', key:'breathing_bracing', setIndex:2, totalSets:2, kind:'work', duration:30, unilateral:false},
    {phase:'Ligero', key:'deadbug', setIndex:1, totalSets:2, kind:'work', duration:35, unilateral:true},
    {phase:'Ligero', key:'deadbug', setIndex:2, totalSets:2, kind:'work', duration:35, unilateral:true}
  ];
  launchRunner(queue, 'Sesión ligera');
}

function launchRunner(queue, title){
  runnerState = {
    queue:queue, index:0, remainingMs:queue[0].duration*1000,
    endTime:null, running:false, halfFired:false, title:title, announcedMarks:{}
  };
  document.getElementById('runner').classList.add('show');
  document.body.style.overflow='hidden';
  ensureAudio();
  stopSpeech();
  speak('Empieza '+title+'.');
  startMusic();
  renderRunnerControls();
  renderRunnerStep(true);
  resumeTimer();
}

function currentStep(){ return runnerState.queue[runnerState.index]; }

function renderRunnerStep(justEntered){
  var step = currentStep();
  var lib = EXLIB[step.key];
  var body = document.getElementById('runnerBody');
  var isRest = step.kind==='rest';
  var nextLabel = isRest ? (EXLIB[runnerState.queue[runnerState.index+1] ? runnerState.queue[runnerState.index+1].key : step.key].name) : nextWorkLabel(runnerState.queue, runnerState.index);

  body.innerHTML =
    '<div class="runner-phase">'+step.phase+'</div>'+
    '<div class="runner-name'+(isRest?' rest':'')+'" id="runnerName">'+(isRest ? 'Descanso' : lib.name)+'</div>'+
    '<div class="runner-set">Serie '+step.setIndex+' de '+step.totalSets+(step.unilateral && step.kind==='work' ? ' · ambos lados' : '')+'</div>'+
    '<div class="runner-time" id="runnerTime">'+fmtTime(runnerState.remainingMs/1000)+'</div>'+
    '<div class="runner-side" id="runnerSide"></div>'+
    (!isRest ? '<div class="runner-desc">'+(lib.brief||lib.cue)+'</div>' : '')+
    (nextLabel ? '<div class="runner-next">Siguiente: '+nextLabel+'</div>' : '<div class="runner-next">Última serie</div>')+
    (musicMode==='active' ? '<div class="runner-desc" id="spotifyRunnerNote"></div>' : '')+
    '<button class="runner-info" id="runnerInfoBtn">Ver ejercicio</button>'+
    (musicMode==='active' ? '<button class="runner-info" id="spotifyRunnerNextBtn">⏭ Siguiente canción</button>' : '');

  document.getElementById('runnerInfoBtn').addEventListener('click', function(){ openInfo(step.key); });
  if(musicMode==='active'){
    document.getElementById('spotifyRunnerNextBtn').addEventListener('click', spotifyNext);
  }

  updateProgress();
  runnerState.announcedMarks = {};
  if(justEntered){
    if(!isRest){
      beepWorkStart(); vibrate([120]);
      if(step.setIndex===1){ speak(lib.name+'. '+(lib.brief||lib.cue)); }
      else { speak('Serie '+step.setIndex+'. '+lib.name+'.'); }
    } else {
      beepRestStart(); vibrate([60]);
      speak('Descanso.');
    }
  }
  runnerState.halfFired = false;
}

function updateProgress(){
  var pct = Math.round((runnerState.index/runnerState.queue.length)*100);
  document.getElementById('progressFill').style.width = pct+'%';
}

function renderRunnerControls(){
  var el = document.getElementById('runnerControls');
  el.innerHTML =
    '<button class="ctrlbtn exit" id="btnExit" aria-label="Salir">&#10005;</button>'+
    '<button class="ctrlbtn" id="btnBack" aria-label="Atrás">&#9664;&#9664;</button>'+
    '<button class="ctrlbtn big" id="btnPause" aria-label="Pausa">&#10074;&#10074;</button>'+
    '<button class="ctrlbtn" id="btnSkip" aria-label="Saltar">&#9654;&#9654;</button>';
  document.getElementById('btnExit').addEventListener('click', exitRunner);
  document.getElementById('btnBack').addEventListener('click', function(){ goStep(-1); });
  document.getElementById('btnSkip').addEventListener('click', function(){ goStep(1); });
  document.getElementById('btnPause').addEventListener('click', togglePause);
}

var tickHandle = null;

function resumeTimer(){
  runnerState.running = true;
  runnerState.endTime = Date.now() + runnerState.remainingMs;
  document.getElementById('btnPause').innerHTML = '&#10074;&#10074;';
  tick();
}

function pauseTimer(){
  runnerState.running = false;
  runnerState.remainingMs = Math.max(0, runnerState.endTime - Date.now());
  if(tickHandle) clearTimeout(tickHandle);
  stopSpeech();
  pauseMusic();
  document.getElementById('btnPause').innerHTML = '&#9654;';
}

function togglePause(){
  if(!runnerState) return;
  if(runnerState.running) pauseTimer(); else { resumeTimer(); resumeMusic(); }
}

function tick(){
  if(!runnerState || !runnerState.running) return;
  var remaining = runnerState.endTime - Date.now();
  if(remaining <= 0){
    advanceStep();
    return;
  }
  runnerState.remainingMs = remaining;
  var remSec = remaining/1000;
  var timeEl = document.getElementById('runnerTime');
  if(timeEl) timeEl.textContent = fmtTime(remSec);

  var step = currentStep();
  if(step.kind==='work' && step.unilateral && !runnerState.halfFired){
    var half = step.duration/2;
    if(remSec <= half){
      runnerState.halfFired = true;
      beepSwitch(); vibrate([80,60,80]);
      var sideEl = document.getElementById('runnerSide');
      if(sideEl){ sideEl.textContent = 'Cambia de lado'; setTimeout(function(){ if(sideEl) sideEl.textContent=''; }, 2200); }
      speak('Cambia de lado.');
    }
  }
  timeAnnouncementMarks(step.duration).forEach(function(mark){
    if(!runnerState.announcedMarks[mark] && remSec <= mark){
      runnerState.announcedMarks[mark] = true;
      speak('Quedan '+mark+' segundos.');
    }
  });
  if(remSec <= 3.05 && remSec > 0){
    beepTick();
  }

  tickHandle = setTimeout(tick, 250);
}

function timeAnnouncementMarks(duration){
  var marks = [];
  if(duration >= 40) marks.push(20);
  if(duration >= 20) marks.push(10);
  return marks;
}

function advanceStep(){
  if(runnerState.index >= runnerState.queue.length - 1){
    finishWorkout();
    return;
  }
  runnerState.index += 1;
  var step = currentStep();
  runnerState.remainingMs = step.duration*1000;
  renderRunnerStep(true);
  runnerState.endTime = Date.now() + runnerState.remainingMs;
  tick();
}

function goStep(dir){
  if(!runnerState) return;
  stopSpeech();
  var newIdx = runnerState.index + dir;
  if(newIdx < 0) newIdx = 0;
  if(newIdx > runnerState.queue.length-1) { finishWorkout(); return; }
  runnerState.index = newIdx;
  var step = currentStep();
  runnerState.remainingMs = step.duration*1000;
  renderRunnerStep(false);
  if(runnerState.running){
    runnerState.endTime = Date.now() + runnerState.remainingMs;
  }
}

function finishWorkout(){
  if(tickHandle) clearTimeout(tickHandle);
  beepFinish(); vibrate([120,80,120,80,200]);
  stopSpeech();
  speak('Sesión completada. Buen trabajo.');
  var body = document.getElementById('runnerBody');
  body.innerHTML =
    '<div class="donecard">'+
      '<div class="tick">&#10003;</div>'+
      '<h2>Sesión completada</h2>'+
      '<p>Buen trabajo. Deja pasar el resto del día sin cargas extra en la zona lumbar.</p>'+
      '<button class="btn btn-primary" id="btnFinishExit">Volver</button>'+
    '</div>';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('runnerControls').innerHTML = '';
  document.getElementById('btnFinishExit').addEventListener('click', exitRunner);
}

function exitRunner(){
  if(tickHandle) clearTimeout(tickHandle);
  stopSpeech();
  stopMusic();
  runnerState = null;
  document.getElementById('runner').classList.remove('show');
  document.body.style.overflow='';
}

renderEquipBar();
renderTypeBar();
renderSessionCard();
renderLibrary();
handleSpotifyRedirect();
initMusicMode();
renderMusicCard();

})();
</script>
